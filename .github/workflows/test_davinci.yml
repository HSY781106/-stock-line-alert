name: Test DaVinci Assistant API

on:
  workflow_dispatch:

jobs:
  test-davinci:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install OpenAI SDK
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install openai

      - name: Test DaVinci Assistant API
        env:
          DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}
          DAVINCI_ASSISTANT_ID: asst_dvc_o2KvewHb9c1XLXlHsFypCe8N
          DAVINCI_API_URL: https://prod.dvcbot.net/api/assts/v1
        run: |
          python3 - <<'PY'
          import os
          import sys
          import time
          from openai import OpenAI

          API_KEY = os.environ["DAVINCI_API_KEY"]
          ASSISTANT_ID = os.environ["DAVINCI_ASSISTANT_ID"]
          BASE_URL = os.environ["DAVINCI_API_URL"]

          print("=" * 70)
          print("DaVinci Assistant API 測試 V2")
          print("=" * 70)
          print(f"Assistant ID：{ASSISTANT_ID}")
          print(f"Endpoint：{BASE_URL}")
          print("API Key：已從 GitHub Secrets 讀取")
          print("=" * 70)

          client = OpenAI(
              api_key=API_KEY,
              base_url=BASE_URL,
          )

          prompt = """請用繁體中文簡短回答：

          如果一家台灣公司主要供應 AI 伺服器相關零組件，
          分析它是否屬於 AI 題材時，應該如何區分：

          1. 直接受惠
          2. 供應鏈間接受惠
          3. 只有題材相關但實際受惠有限

          並說明為什麼不能只看到「AI」關鍵字就判定利多。
          """

          # ------------------------------------------------------------
          # 1. 建立 Thread
          # ------------------------------------------------------------
          print()
          print("【1/4】建立 Thread...")

          try:
              thread = client.beta.threads.create()
          except Exception as e:
              print()
              print("❌ 建立 Thread 失敗")
              print(type(e).__name__)
              print(str(e))
              sys.exit(1)

          print(f"Thread ID：{thread.id}")

          # ------------------------------------------------------------
          # 2. 建立 Message
          # ------------------------------------------------------------
          print()
          print("【2/4】送出測試問題...")

          try:
              message = client.beta.threads.messages.create(
                  thread_id=thread.id,
                  role="user",
                  content=prompt,
              )
          except Exception as e:
              print()
              print("❌ 建立 Message 失敗")
              print(type(e).__name__)
              print(str(e))
              sys.exit(1)

          print(f"Message ID：{message.id}")

          # ------------------------------------------------------------
          # 3. 執行 Assistant
          # ------------------------------------------------------------
          print()
          print("【3/4】執行 Assistant...")

          try:
              run = client.beta.threads.runs.create(
                  thread_id=thread.id,
                  assistant_id=ASSISTANT_ID,
              )
          except Exception as e:
              print()
              print("❌ 建立 Run 失敗")
              print(type(e).__name__)
              print(str(e))
              sys.exit(1)

          print(f"Run ID：{run.id}")
          print(f"初始狀態：{run.status}")

          # ------------------------------------------------------------
          # 4. Polling
          # ------------------------------------------------------------
          print()
          print("【4/4】等待 DaVinci / Claude Sonnet 4.6 回覆...")

          for i in range(60):
              time.sleep(2)

              try:
                  run = client.beta.threads.runs.retrieve(
                      thread_id=thread.id,
                      run_id=run.id,
                  )
              except Exception as e:
                  print()
                  print("❌ 查詢 Run 狀態失敗")
                  print(type(e).__name__)
                  print(str(e))
                  sys.exit(1)

              print(f"  Poll {i + 1:02d}：{run.status}")

              if run.status == "completed":
                  break

              if run.status in [
                  "failed",
                  "cancelled",
                  "expired",
                  "requires_action",
              ]:
                  print()
                  print("❌ Assistant 執行未完成")
                  print(f"Status：{run.status}")

                  if getattr(run, "last_error", None):
                      print(f"Error：{run.last_error}")

                  sys.exit(1)

          if run.status != "completed":
              print()
              print("❌ 等待超時")
              sys.exit(1)

          # ------------------------------------------------------------
          # 取得回答
          # ------------------------------------------------------------
          print()
          print("=" * 70)
          print("DaVinci Assistant 回覆")
          print("=" * 70)

          try:
              messages = client.beta.threads.messages.list(
                  thread_id=thread.id,
                  order="desc",
              )
          except Exception as e:
              print("❌ 取得 Message 失敗")
              print(type(e).__name__)
              print(str(e))
              sys.exit(1)

          answer = None

          for msg in messages.data:
              if msg.role != "assistant":
                  continue

              for content in msg.content:
                  if getattr(content, "type", None) == "text":
                      answer = content.text.value
                      break

              if answer:
                  break

          if not answer:
              print("❌ 找不到 Assistant 文字回覆")
              sys.exit(1)

          print(answer)

          print()
          print("=" * 70)
          print("✅ DaVinci Assistant API 測試成功")
          print("=" * 70)
          print("模型：Claude Sonnet 4.6")
          print(f"Assistant ID：{ASSISTANT_ID}")
          print(f"Thread ID：{thread.id}")
          print(f"Run ID：{run.id}")
          print("=" * 70)

          # ------------------------------------------------------------
          # 清理 Thread
          # ------------------------------------------------------------
          try:
              client.beta.threads.delete(thread.id)
              print("Thread 已清理")
          except Exception:
              pass
          PY
