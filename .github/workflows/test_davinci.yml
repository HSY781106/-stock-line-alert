name: Test DaVinci Assistant API

on:
  workflow_dispatch:

jobs:
  test-davinci:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test DaVinci Assistant API
        env:
          DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}
          DAVINCI_ASSISTANT_ID: asst_dvc_o2KvewHb9c1XLXlHsFypCe8N
          DAVINCI_API_URL: https://prod.dvcbot.net/api/assts/v1
        run: |
          python3 - <<'PY'
          import os
          import sys
          import json
          import time
          import requests

          API_KEY = os.environ["DAVINCI_API_KEY"]
          ASSISTANT_ID = os.environ["DAVINCI_ASSISTANT_ID"]
          BASE_URL = os.environ["DAVINCI_API_URL"].rstrip("/")

          print("=" * 70)
          print("DaVinci Assistant API 測試")
          print("=" * 70)
          print(f"Assistant ID：{ASSISTANT_ID}")
          print(f"Endpoint：{BASE_URL}")
          print("API Key：已從 GitHub Secrets 讀取")
          print("=" * 70)

          headers = {
              "Authorization": f"Bearer {API_KEY}",
              "Content-Type": "application/json",
          }

          prompt = """請測試你目前的 AI 能力。

          請用繁體中文回答以下問題：

          「如果一家台灣公司主要供應 AI 伺服器相關零組件，
          分析它是否屬於 AI 題材時，應該如何區分：
          1. 直接受惠
          2. 供應鏈間接受惠
          3. 只有題材相關但實際受惠有限

          請簡短回答，並說明不能只看到『AI』關鍵字就判定利多的原因。」

          不要輸出 Markdown 表格。
          """

          def show_response(resp, label):
              print()
              print(f"========== {label} ==========")
              print(f"HTTP Status：{resp.status_code}")
              print(f"Content-Type：{resp.headers.get('content-type', '')}")

              text = resp.text

              if len(text) > 12000:
                  text = text[:12000] + "\n...[response truncated]"

              print(text)

          # ------------------------------------------------------------
          # 1. 建立 Thread
          # ------------------------------------------------------------
          print()
          print("【1/4】建立 Thread...")

          r = requests.post(
              f"{BASE_URL}/threads",
              headers=headers,
              json={},
              timeout=30,
          )

          show_response(r, "Create Thread")

          if not r.ok:
              print("\n❌ DaVinci API：建立 Thread 失敗")
              sys.exit(1)

          thread_data = r.json()
          thread_id = thread_data.get("id")

          if not thread_id:
              print("\n❌ API 回應沒有 thread id")
              print(json.dumps(thread_data, ensure_ascii=False, indent=2))
              sys.exit(1)

          print(f"Thread ID：{thread_id}")

          # ------------------------------------------------------------
          # 2. 建立 Message
          # ------------------------------------------------------------
          print()
          print("【2/4】送出測試問題...")

          message_payload = {
              "role": "user",
              "content": prompt,
          }

          r = requests.post(
              f"{BASE_URL}/threads/{thread_id}/messages",
              headers=headers,
              json=message_payload,
              timeout=30,
          )

          show_response(r, "Create Message")

          if not r.ok:
              print("\n❌ DaVinci API：建立 Message 失敗")
              sys.exit(1)

          # ------------------------------------------------------------
          # 3. 執行 Assistant
          # ------------------------------------------------------------
          print()
          print("【3/4】執行 Assistant...")

          run_payload = {
              "assistant_id": ASSISTANT_ID,
          }

          r = requests.post(
              f"{BASE_URL}/threads/{thread_id}/runs",
              headers=headers,
              json=run_payload,
              timeout=30,
          )

          show_response(r, "Create Run")

          if not r.ok:
              print("\n❌ DaVinci API：建立 Run 失敗")
              sys.exit(1)

          run_data = r.json()
          run_id = run_data.get("id")

          if not run_id:
              print("\n❌ API 回應沒有 run id")
              print(json.dumps(run_data, ensure_ascii=False, indent=2))
              sys.exit(1)

          print(f"Run ID：{run_id}")

          # ------------------------------------------------------------
          # 4. Polling Run
          # ------------------------------------------------------------
          print()
          print("【4/4】等待 Claude Sonnet 4.6 回覆...")

          final_run = None

          for i in range(60):
              time.sleep(2)

              r = requests.get(
                  f"{BASE_URL}/threads/{thread_id}/runs/{run_id}",
                  headers=headers,
                  timeout=30,
              )

              if not r.ok:
                  show_response(r, "Get Run Status")
                  print("\n❌ 查詢 Run 狀態失敗")
                  sys.exit(1)

              data = r.json()
              status = data.get("status", "")

              print(f"  Poll {i + 1:02d}：{status}")

              if status in {
                  "completed",
                  "failed",
                  "cancelled",
                  "expired",
                  "requires_action",
              }:
                  final_run = data
                  break

          if final_run is None:
              print("\n❌ 等待超時")
              sys.exit(1)

          status = final_run.get("status")

          if status != "completed":
              print()
              print(f"❌ Assistant 執行失敗")
              print(f"Status：{status}")
              print(json.dumps(final_run, ensure_ascii=False, indent=2))
              sys.exit(1)

          # ------------------------------------------------------------
          # 取得 Messages
          # ------------------------------------------------------------
          print()
          print("========== Assistant 回覆 ==========")

          r = requests.get(
              f"{BASE_URL}/threads/{thread_id}/messages",
              headers=headers,
              timeout=30,
          )

          if not r.ok:
              show_response(r, "List Messages")
              print("\n❌ 取得 Assistant 回覆失敗")
              sys.exit(1)

          messages_data = r.json()

          # 印出最後一則 assistant message
          messages = messages_data.get("data", [])

          assistant_message = None

          for message in messages:
              if message.get("role") == "assistant":
                  assistant_message = message
                  break

          if assistant_message is None:
              print("❌ 沒有找到 Assistant 回覆")
              print(json.dumps(messages_data, ensure_ascii=False, indent=2))
              sys.exit(1)

          content = assistant_message.get("content", [])

          output_parts = []

          for item in content:
              if isinstance(item, dict):
                  if item.get("type") == "text":
                      text_obj = item.get("text", {})

                      if isinstance(text_obj, dict):
                          value = text_obj.get("value", "")
                      else:
                          value = str(text_obj)

                      if value:
                          output_parts.append(value)

          answer = "\n".join(output_parts).strip()

          if not answer:
              print("⚠️ 找到 Assistant message，但沒有解析到文字內容")
              print(json.dumps(assistant_message, ensure_ascii=False, indent=2))
              sys.exit(1)

          print(answer)

          print()
          print("=" * 70)
          print("✅ DaVinci Assistant API 測試成功")
          print("=" * 70)
          print(f"Assistant ID：{ASSISTANT_ID}")
          print("模型：Claude Sonnet 4.6")
          print(f"Thread：{thread_id}")
          print(f"Run：{run_id}")
          print("=" * 70)
          PY
