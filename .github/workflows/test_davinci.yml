name: Test DaVinci Assistant API V4

on:
  workflow_dispatch:

jobs:
  test-davinci:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install openai httpx

      - name: Diagnose DaVinci Redirect
        env:
          DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}
          DAVINCI_ASSISTANT_ID: asst_dvc_o2KvewHb9c1XLXlHsFypCe8N
          DAVINCI_API_URL: https://prod.dvcbot.net/api/assts/v1
        run: |
          python3 - <<'PY'
          import os
          import httpx

          API_KEY = os.environ["DAVINCI_API_KEY"]
          ASSISTANT_ID = os.environ["DAVINCI_ASSISTANT_ID"]
          BASE_URL = os.environ["DAVINCI_API_URL"].rstrip("/")

          THREAD_URL = BASE_URL + "/threads"

          print("=" * 70)
          print("DaVinci Assistant API 測試 V4")
          print("=" * 70)
          print(f"Assistant ID：{ASSISTANT_ID}")
          print(f"Endpoint：{BASE_URL}")
          print(f"API Key 長度：{len(API_KEY)}")
          print("=" * 70)

          headers = {
              "Authorization": f"Bearer {API_KEY}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          payload = {
              "messages": [
                  {
                      "role": "user",
                      "content": "請用繁體中文回答：什麼是 AI？請簡短回答。"
                  }
              ]
          }

          print()
          print("【1】直接呼叫 Thread API")
          print(f"URL：{THREAD_URL}")
          print()

          with httpx.Client(
              follow_redirects=False,
              timeout=30.0
          ) as client:

              response = client.post(
                  THREAD_URL,
                  headers=headers,
                  json=payload,
              )

              print(f"HTTP Status：{response.status_code}")

              print()
              print("Response Headers：")

              for key, value in response.headers.items():
                  if key.lower() in {
                      "location",
                      "server",
                      "content-type",
                      "www-authenticate",
                      "x-powered-by",
                  }:
                      print(f"  {key}: {value}")

              print()

              location = response.headers.get("location")

              if response.status_code in (301, 302, 303, 307, 308):
                  print("⚠️ 發現 HTTP Redirect")
                  print()

                  if location:
                      print(f"Location：{location}")

                      if location.startswith("https://prod.dvcbot.net"):
                          print("Redirect 類型：同 Host")
                      elif location.startswith("https://"):
                          print("Redirect 類型：不同 HTTPS Host")
                      elif location.startswith("/"):
                          print("Redirect 類型：同 Host 相對路徑")
                      else:
                          print("Redirect 類型：其他")
                  else:
                      print("❌ 301/Redirect 沒有 Location Header")

              elif response.status_code == 401:
                  print("❌ 仍然是 401")
                  print(response.text[:1000])

              elif response.status_code >= 400:
                  print("❌ API 錯誤")
                  print(response.text[:2000])

              else:
                  print("✅ 非 Redirect")
                  print()
                  print("Response：")
                  print(response.text[:3000])

          print()
          print("=" * 70)
          print("V4 診斷完成")
          print("=" * 70)
          PY
