name: DaVinci Assistant API Test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  davinci-api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx
      - name: Check test file
        run: |
          echo "========================================"
          echo "檢查 DaVinci 測試檔"
          echo "========================================"
          if [ ! -f "davinci_api_test" ]; then
            echo "❌ 找不到 Repo 根目錄的 davinci_api_test"
            echo ""
            echo "目前 Repo 根目錄："
            ls -la
            exit 1
          fi
          echo "✅ 找到 davinci_api_test"
          echo ""
          echo "檔案資訊："
          wc -l davinci_api_test
          echo ""
      - name: Run DaVinci API diagnostic
        env:
          DAVINCI_ASSISTANT_ID: ${{ secrets.DAVINCI_ASSISTANT_ID }}
          DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}
          DAVINCI_API_URL: ${{ secrets.DAVINCI_API_URL }}
        run: |
          echo "========================================"
          echo "DaVinci Assistant API Diagnostic"
          echo "========================================"
          echo ""
          python davinci_api_test
