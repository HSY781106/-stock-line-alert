name: Stock Alert V2.14.22

on:
  schedule:
    - cron: '*/15 1-5 * * 1-5'  # Taiwan 09:00-13:45 UTC
    - cron: '30,45 13 * * 1-5'
    - cron: '*/15 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-alert-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 13

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: python stock_alert.py

      - name: Save generated state and caches
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # V2.14.22：除原有狀態/快取外，保存「全市場次產業自動建置」
          # 的 menu cache 與 cursor，讓每次 Actions 接續補抓，不要求 LINE 使用者提供股票代號。
          git add -A

          git diff --cached --quiet || git commit -m "Update stock alert state and caches V2.14.22"

          git fetch origin main
          git rebase origin/main || (git rebase --abort && git stash push -u -m "v21422-state" && git pull --rebase origin main && git stash pop)
          git push origin HEAD:main
