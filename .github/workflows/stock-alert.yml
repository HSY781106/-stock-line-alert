name: Stock Alert V2.14.27
on:
  schedule:
    - cron: '*/15 1-5 * * 1-5'
    - cron: '30,45 13 * * 1-5'
    - cron: '*/15 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-alert-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 13

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pypdf

      - name: Run stock alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: python stock_alert.py

      - name: Save state and caches
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update V2.14.27 alert state, industry cache and Trump portfolio"
          git pull --rebase origin main || true
          git push origin HEAD:main
