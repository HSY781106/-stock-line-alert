name: Stock Alert V2.23.10

on:
  schedule:
    # =========================================
    # 台灣時間 09:00–13:45
    # 週一～週五，每 15 分鐘
    # =========================================
    - cron: "*/15 9-13 * * 1-5"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 21:30、21:45
    # 週一～週五
    # =========================================
    - cron: "30,45 21 * * 1-5"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 22:00–23:45
    # 週一～週五，每 15 分鐘
    # =========================================
    - cron: "*/15 22-23 * * 1-5"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 00:00–04:45
    # 週二～週六
    # 對應週一～週五晚上的美股時段
    # =========================================
    - cron: "*/15 0-4 * * 2-6"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 05:00
    # 週二～週六
    # =========================================
    - cron: "0 5 * * 2-6"
      timezone: "Asia/Taipei"

  workflow_dispatch:

# =========================================
# GitHub Actions concurrency
#
# 同一時間只允許一個 Stock Alert workflow
# 修改 repository。
#
# 不取消正在執行中的 run。
# =========================================
concurrency:
  group: stock-alert-main
  cancel-in-progress: false

jobs:
  stock-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:

      # =========================================
      # 1. Checkout repository
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =========================================
      # 2. Setup Python
      # =========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # =========================================
      # 3. Install dependencies
      # =========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pypdf

      # =========================================
      # 4. Run Stock Alert
      # =========================================
      - name: Run Stock Alert V2.23.10
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}

          PYTHONUNBUFFERED: "1"
          TZ: Asia/Taipei

        run: |
          echo "=============================================="
          echo "Stock Alert Schedule Diagnostic V2.23.10"
          echo "Taiwan time:"
          TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z'
          echo "UTC time:"
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "GitHub event:"
          echo '${{ github.event.schedule }}'
          echo "=============================================="

          python stock_alert.py

      # =========================================
      # 5. Save state and caches
      #
      # 最終防衝突版本
      #
      # 不使用：
      #   git rebase origin/main
      #
      # 不使用：
      #   git merge origin/main
      #
      # 不使用：
      #   git push --force
      #
      # 流程：
      #
      #   A. 先把本次執行產生的 staged 檔案保存到
      #      /tmp/runtime_snapshot
      #
      #   B. fetch 最新 origin/main
      #
      #   C. reset 到最新 origin/main
      #
      #   D. 把本次執行產生的檔案原樣放回
      #
      #   E. commit
      #
      #   F. push
      #
      # 如果 push 時 remote 又被更新：
      #   → 再 fetch
      #   → 再 reset 最新 main
      #   → 再套回本次 runtime snapshot
      #   → 再 push
      #
      # 最多重試 5 次。
      # =========================================
      - name: Save state and caches
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "Save state and caches - V2.23.10"
          echo "=============================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # =========================================
          # Runtime file size protection
          # =========================================
          echo "========== Check runtime file sizes =========="

          MAX_BYTES=$((95 * 1024 * 1024))

          for FILE in chip_history.json pe_history.json alert_state.json; do
            if [ -f "$FILE" ]; then

              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1024/1024}")

              echo "$FILE : ${SIZE_MB} MB"

              if [ "$SIZE" -gt "$MAX_BYTES" ]; then
                echo "::error file=$FILE::File exceeds 95 MiB. Commit cancelled."
                exit 1
              fi

            fi
          done

          echo "=============================================="

          # =========================================
          # Stage everything generated by Python
          # =========================================
          git add -A

          if git diff --cached --quiet; then
            echo "No state/cache changes to commit."
            exit 0
          fi

          # =========================================
          # Create temporary runtime snapshot
          #
          # 每個被本次執行修改的檔案都直接保存「本次
          # 執行後的最終內容」。
          #
          # 不保存 Git metadata。
          # =========================================
          SNAPSHOT_DIR="/tmp/stock_alert_runtime_snapshot"
          rm -rf "$SNAPSHOT_DIR"
          mkdir -p "$SNAPSHOT_DIR"

          echo "========== Creating runtime snapshot =========="

          # -----------------------------------------
          # Save list of staged paths.
          # -----------------------------------------
          git diff --cached --name-only -z > /tmp/stock_alert_changed_files

          # -----------------------------------------
          # Save deleted files list separately.
          # -----------------------------------------
          git diff --cached --diff-filter=D --name-only -z \
            > /tmp/stock_alert_deleted_files

          # -----------------------------------------
          # Save every staged file exactly as it
          # appears in the Git index.
          #
          # This avoids trying to merge JSON contents.
          # -----------------------------------------
          while IFS= read -r -d '' FILE; do

            if git cat-file -e ":$FILE" 2>/dev/null; then

              DEST="$SNAPSHOT_DIR/$FILE"

              mkdir -p "$(dirname "$DEST")"

              git show ":$FILE" > "$DEST"

              echo "Saved: $FILE"

            else

              echo "Deleted: $FILE"

            fi

          done < /tmp/stock_alert_changed_files

          echo "=============================================="

          # =========================================
          # Save executable permission information
          # for changed files.
          # =========================================
          git diff --cached --summary > \
            /tmp/stock_alert_snapshot_modes

          # =========================================
          # Retry push
          # =========================================
          MAX_RETRIES=5
          PUSH_SUCCESS=0

          for ATTEMPT in $(seq 1 "$MAX_RETRIES"); do

            echo ""
            echo "=============================================="
            echo "Git save attempt ${ATTEMPT}/${MAX_RETRIES}"
            echo "=============================================="

            # =======================================
            # Get latest remote main
            # =======================================
            git fetch --prune origin main

            REMOTE_SHA="$(git rev-parse origin/main)"

            echo "Latest origin/main:"
            echo "$REMOTE_SHA"

            # =======================================
            # Reset local branch completely to the
            # latest GitHub main.
            #
            # This is the key difference from the
            # previous workflow:
            #
            # NO REBASE
            # NO JSON MERGE
            # =======================================
            git reset --hard origin/main

            # =======================================
            # Restore files generated by THIS run.
            # =======================================
            echo "========== Restoring runtime snapshot =========="

            while IFS= read -r -d '' FILE; do

              if [ -f "$SNAPSHOT_DIR/$FILE" ]; then

                mkdir -p "$(dirname "$FILE")"

                cp -f \
                  "$SNAPSHOT_DIR/$FILE" \
                  "$FILE"

                echo "Restored: $FILE"

              fi

            done < /tmp/stock_alert_changed_files

            # =======================================
            # Re-apply deletions from this run.
            # =======================================
            while IFS= read -r -d '' FILE; do

              if [ -e "$FILE" ] || [ -L "$FILE" ]; then

                rm -f "$FILE"

                echo "Deleted: $FILE"

              fi

            done < /tmp/stock_alert_deleted_files

            # =======================================
            # Restore executable permissions where
            # applicable.
            # =======================================
            if [ -s /tmp/stock_alert_snapshot_modes ]; then

              echo "========== Restoring file modes =========="

              while IFS= read -r LINE; do

                case "$LINE" in

                  "* mode "*)
                    echo "$LINE"
                    ;;

                esac

              done < /tmp/stock_alert_snapshot_modes

            fi

            # =======================================
            # Stage runtime files again.
            # =======================================
            git add -A

            # =======================================
            # Nothing changed after restoring snapshot.
            # =======================================
            if git diff --cached --quiet; then

              echo "No runtime changes remain after synchronization."
              PUSH_SUCCESS=1
              break

            fi

            # =======================================
            # Create commit on top of latest main.
            # =======================================
            git commit \
              -m "Update V2.23.10 alert state and caches"

            echo "Local commit:"
            git log -1 --oneline

            # =======================================
            # Before pushing, fetch again.
            #
            # This catches a remote update that happened
            # while the commit was being created.
            # =======================================
            git fetch --prune origin main

            CURRENT_REMOTE_SHA="$(git rev-parse origin/main)"

            echo "Remote SHA immediately before push:"
            echo "$CURRENT_REMOTE_SHA"

            # =======================================
            # Check whether our commit is based directly
            # on the current remote main.
            #
            # If not, remote changed during this attempt.
            # =======================================
            PARENT_SHA="$(git rev-parse HEAD^)"

            if [ "$PARENT_SHA" != "$CURRENT_REMOTE_SHA" ]; then

              echo "::warning::Remote main changed during save attempt."
              echo "Restarting synchronization..."

              git reset --hard origin/main

              sleep $((ATTEMPT * 3))

              continue

            fi

            # =======================================
            # Normal push.
            #
            # NO force push.
            # =======================================
            if git push origin HEAD:main; then

              echo ""
              echo "=============================================="
              echo "Git push SUCCESS"
              echo "=============================================="

              PUSH_SUCCESS=1
              break

            fi

            # =======================================
            # Push failed.
            #
            # Most likely remote changed between
            # fetch and push.
            # =======================================
            echo "::warning::Git push failed."
            echo "Remote may have changed during push."

            if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
              echo "Retrying..."
              sleep $((ATTEMPT * 5))
            fi

          done

          # =========================================
          # Final result
          # =========================================
          if [ "$PUSH_SUCCESS" -ne 1 ]; then

            echo ""
            echo "=============================================="
            echo "::error::Unable to save state/cache after ${MAX_RETRIES} attempts."
            echo "=============================================="

            exit 1

          fi

          echo ""
          echo "=============================================="
          echo "Save state completed successfully."
          echo "=============================================="
