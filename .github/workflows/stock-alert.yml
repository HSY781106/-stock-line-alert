name: Stock Alert V2.18.10

on:
  schedule:
    # 台灣時間 09:00～14:00
    # GitHub Actions cron 使用 UTC
    - cron: '*/15 1-5 * * 1-5'
    - cron: '30,45 13 * * 1-5'

    # 台灣時間 22:00～04:59
    # 美股主要交易時段
    - cron: '*/15 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'

  workflow_dispatch:

concurrency:
  group: stock-alert-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pypdf

      - name: Run stock alert V2.18.10
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}

          # ============================================================
          # Gemini 主力
          # V2.18.10：改用 API 實際要求的新模型
          # ============================================================
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash

          # ============================================================
          # Mistral 備援
          # ============================================================
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest

          # ============================================================
          # Groq 備援
          # ============================================================
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b

          # ============================================================
          # AI Provider
          # ============================================================
          AI_PROVIDER: gemini
          AI_FALLBACK_PROVIDERS: mistral,groq

          # ============================================================
          # AI 功能
          # ============================================================
          AI_ENABLE_NEWS: '1'
          AI_ENABLE_TRUMP: '1'
          AI_ENABLE_FINAL_SUMMARY: '1'

          AI_WEB_ANALYSIS_ENABLED: '1'
          AI_WEB_TIMEOUT: '15'

          # ============================================================
          # AI 輸出 / 重試
          # V2.18.10：
          # 429 不再重試，直接切換下一家
          # Timeout / Network / 5xx 最多 retry 一次
          # ============================================================
          AI_MAX_OUTPUT_TOKENS: '700'
          AI_RETRY_ON_FAILURE: '1'

          # ============================================================
          # Cache
          # ============================================================
          AI_NEWS_CACHE_HOURS: '168'
          AI_MACRO_CACHE_HOURS: '6'
          AI_TRUMP_CACHE_HOURS: '6'

          # ============================================================
          # Timeout
          # ============================================================
          AI_TIMEOUT: '20'
          MACRO_TIMEOUT: '8'
          MACRO_NEWS_TIMEOUT: '4'
          TRUMP_NEWS_TIMEOUT: '4'

        run: python stock_alert.py

      # ================================================================
      # 保存 state / cache
      # ================================================================
      - name: Save state and caches
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update V2.18.10 alert state and caches"
          fi

          git pull --rebase origin main || true
          git push origin HEAD:main
