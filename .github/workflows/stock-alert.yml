name: Stock Alert V2.23.9

on:
  schedule:
    # 台灣時間 09:07–13:52（週一至週五），每 15 分鐘
    - cron: "7,22,37,52 1-5 * * 1-5"

    # 台灣時間 21:37、21:52（週一至週五）
    - cron: "37,52 13 * * 1-5"

    # 台灣時間 22:07–隔日 04:52，每 15 分鐘
    - cron: "7,22,37,52 14-20 * * 1-5"

    # 台灣時間 05:07（週二至週六）
    - cron: "7 21 * * 2-6"

  workflow_dispatch:

concurrency:
  group: stock-alert-main
  cancel-in-progress: true

jobs:
  stock-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      # =========================================
      # 1. Checkout
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =========================================
      # 2. Setup Python
      # =========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # =========================================
      # 3. Install dependencies
      # =========================================
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pypdf

      # =========================================
      # 4. Run Stock Alert
      # =========================================
      - name: Run Stock Alert V2.23.9
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}

          PYTHONUNBUFFERED: "1"
          TZ: Asia/Taipei

        run: python stock_alert.py

      # =========================================
      # 5. Save state and caches
      # =========================================
      - name: Save state and caches
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========== Check runtime file sizes =========="

          # GitHub 單一檔案限制為 100 MB；
          # 預留空間，設定 95 MiB 保護上限。
          MAX_BYTES=$((95 * 1024 * 1024))

          for FILE in chip_history.json pe_history.json alert_state.json; do
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1024/1024}")

              echo "$FILE : ${SIZE_MB} MB"

              if [ "$SIZE" -gt "$MAX_BYTES" ]; then
                echo "::error file=$FILE::File exceeds 95 MiB. Commit cancelled."
                exit 1
              fi
            fi
          done

          echo "=============================================="

          # 先加入變更並 commit，避免 rebase 時存在未提交變更
          git add -A

          if git diff --cached --quiet; then
            echo "No state/cache changes to commit."
            exit 0
          fi

          git commit -m "Update V2.23.9 alert state and caches"

          # 取得遠端最新版本，再將本次 commit rebase 到 main
          git fetch origin main
          git rebase origin/main

          # 推送更新後的 commit
          git push origin HEAD:main

          echo "========== Save state completed =========="
