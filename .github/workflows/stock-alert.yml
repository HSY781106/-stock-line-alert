name: Stock Alert V2.18.12

on:
  schedule:
    # 台灣時間 09:00～13:45
    - cron: '*/15 1-5 * * 1-5'

    # 台灣時間 21:30、21:45
    - cron: '30,45 13 * * 1-5'

    # 台灣時間 22:00～04:45
    - cron: '*/15 14-20 * * 1-5'

    # 台灣時間 05:00
    - cron: '0 21 * * 1-5'

  workflow_dispatch:

concurrency:
  group: stock-alert-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pypdf

      - name: Run stock alert V2.18.12
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash

          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b

          AI_PROVIDER: gemini
          AI_FALLBACK_PROVIDERS: mistral,groq

          AI_ENABLE_NEWS: '1'
          AI_ENABLE_TRUMP: '1'
          AI_ENABLE_FINAL_SUMMARY: '1'

          AI_WEB_ANALYSIS_ENABLED: '1'
          AI_WEB_TIMEOUT: '15'

          AI_MAX_OUTPUT_TOKENS: '900'
          AI_RETRY_ON_FAILURE: '1'

          AI_MAX_NEWS_PER_BATCH: '4'
          AI_MAX_TRUMP_PER_BATCH: '4'

          AI_NEWS_CACHE_HOURS: '168'
          AI_MACRO_CACHE_HOURS: '6'
          AI_TRUMP_CACHE_HOURS: '6'

          AI_TIMEOUT: '25'
          MACRO_TIMEOUT: '8'
          MACRO_NEWS_TIMEOUT: '4'
          TRUMP_NEWS_TIMEOUT: '4'

        run: python stock_alert.py

      - name: Save state and caches
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update V2.18.12 alert state and caches"
          fi

          git pull --rebase origin main || true
          git push origin HEAD:main
