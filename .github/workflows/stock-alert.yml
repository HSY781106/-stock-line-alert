      - name: Save state and caches
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========== Check runtime file sizes =========="

          MAX_BYTES=$((95 * 1024 * 1024))

          for FILE in chip_history.json pe_history.json alert_state.json; do
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1024/1024}")

              echo "$FILE : ${SIZE_MB} MB"

              if [ "$SIZE" -gt "$MAX_BYTES" ]; then
                echo "::error file=$FILE::File exceeds 95 MB. Commit cancelled."
                exit 1
              fi
            fi
          done

          echo "=============================================="

          # 先將變更加入暫存區
          git add -A

          # 沒有變更就結束
          if git diff --cached --quiet; then
            echo "No state/cache changes."
            exit 0
          fi

          # 先 commit，避免 rebase 遇到未提交變更
          git commit -m "Update V2.23.9 alert state and caches"

          # 再同步遠端
          git fetch origin main
          git rebase origin/main

          # 最後推送
          git push origin HEAD:main

          echo "========== Save state completed =========="
