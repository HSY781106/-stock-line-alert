name: Stock Alert V2.23.10

on:
  schedule:
    # =========================================
    # 台灣時間 09:00–13:45
    # 週一～週五，每 15 分鐘
    # =========================================
    - cron: "*/15 9-13 * * 1-5"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 21:30、21:45
    # 週一～週五
    # =========================================
    - cron: "30,45 21 * * 1-5"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 22:00–23:45
    # 週一～週五，每 15 分鐘
    # =========================================
    - cron: "*/15 22-23 * * 1-5"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 00:00–04:45
    # 週二～週六
    # 對應週一～週五晚上的美股時段
    # =========================================
    - cron: "*/15 0-4 * * 2-6"
      timezone: "Asia/Taipei"

    # =========================================
    # 台灣時間 05:00
    # 週二～週六
    # =========================================
    - cron: "0 5 * * 2-6"
      timezone: "Asia/Taipei"

  workflow_dispatch:

concurrency:
  group: stock-alert-main
  # GitHub schedule 可能延遲；不要因下一個排程而取消已觸發的 run。
  cancel-in-progress: false

jobs:
  stock-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:

      # =========================================
      # 1. Checkout
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # =========================================
      # 2. Setup Python
      # =========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # =========================================
      # 3. Install dependencies
      # =========================================
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pypdf

      # =========================================
      # 4. Run Stock Alert
      # =========================================
      - name: Run Stock Alert V2.23.10
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}

          PYTHONUNBUFFERED: "1"
          TZ: Asia/Taipei

        run: |
          echo "=============================================="
          echo "Stock Alert Schedule Diagnostic V2.23.10"
          echo "Taiwan time:"
          TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S %Z'
          echo "UTC time:"
          date -u '+%Y-%m-%d %H:%M:%S UTC'
          echo "GitHub event:"
          echo '${{ github.event.schedule }}'
          echo "=============================================="

          python stock_alert.py

      # =========================================
      # 5. Save state and caches
      # =========================================
      - name: Save state and caches
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========== Check runtime file sizes =========="

          MAX_BYTES=$((95 * 1024 * 1024))

          for FILE in chip_history.json pe_history.json alert_state.json; do
            if [ -f "$FILE" ]; then

              SIZE=$(stat -c%s "$FILE")
              SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1024/1024}")

              echo "$FILE : ${SIZE_MB} MB"

              if [ "$SIZE" -gt "$MAX_BYTES" ]; then
                echo "::error file=$FILE::File exceeds 95 MiB. Commit cancelled."
                exit 1
              fi

            fi
          done

          echo "=============================================="

          git add -A

          if git diff --cached --quiet; then
            echo "No state/cache changes to commit."
            exit 0
          fi

          git commit -m "Update V2.23.10 alert state and caches"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

          echo "========== Save state completed =========="
