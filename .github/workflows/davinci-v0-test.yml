name: DaVinci V0 Production API Test

on:
  workflow_dispatch:

jobs:
  davinci-v0-test:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      DAVINCI_API_KEY: ${{ secrets.DAVINCI_API_KEY }}
      DVC_ASSISTANT_ID: asst_dvc_o2KvewHb9c1XLXlHsFypCe8N
      DVC_BASE_URL: https://prod.dvcbot.net/api/assts/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run DaVinci Production API Test
        run: |
          python davinci_prod_official_test.py
