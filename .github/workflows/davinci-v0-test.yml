name: DaVinci V0 Production API Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  davinci-v0-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # 使用你原本已存在的 GitHub Secret
      DVC_API_KEY: ${{ secrets.DAVINCI_API_KEY }}

      # DaVinci Assistant
      DVC_ASSISTANT_ID: asst_dvc_o2KvewHb9c1XLXlHsFypCe8N

      # 官方 Production API
      DVC_BASE_URL: https://prod.dvcbot.net/api/assts/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run DaVinci Production V0 test
        run: python davinci_prod_official_test.py
